<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f7f6f1">
  <title>The Reading Room</title>
  <style>
    /* Colors and page defaults */
:root { --green:#214c3d; --deep:#173b30; --sage:#e9f0e8; --gold:#d9b66f; --paper:#f7f6f1; --white:#fffefa; --muted:#858d84; --line:#e8e7de; }
* { box-sizing:border-box; }
body { margin:0; background:var(--paper); color:#24362c; font:14px Arial,sans-serif; }
button,input,select,textarea { font:inherit; }
button { cursor:pointer; }
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible { outline:2px solid #78a082; outline-offset:2px; }

/* Side navigation */
.app { min-height:100vh; }
aside { position:fixed; inset:0 auto 0 0; z-index:3; display:flex; width:235px; flex-direction:column; padding:25px 15px 16px; background:var(--deep); color:#f5f4e9; }
.brand { display:flex; align-items:center; gap:10px; padding:0 7px; color:inherit; font:17px Georgia,serif; text-decoration:none; }
.brand span { color:var(--gold); font-size:26px; }
.club { display:flex; align-items:center; gap:10px; margin:34px 0 28px; padding:10px; border:1px solid #355448; border-radius:8px; }
.club>b,.profile>b { display:grid; place-items:center; width:32px; height:32px; border-radius:7px; background:var(--gold); color:var(--deep); font:20px Georgia,serif; }
.club span,.profile span { display:grid; gap:3px; }
.club small,.profile small { color:#aebcae; font-size:10px; }
.label { margin:0 10px 8px; color:#8ba092; font-size:9px; letter-spacing:1.4px; }
nav { display:grid; gap:4px; }
nav button { display:flex; align-items:center; gap:12px; padding:12px 10px; border:0; border-radius:7px; background:transparent; color:#c7d3c7; font-size:16px; text-align:left; }
nav button span { font-size:12px; }
nav button small { margin-left:auto; }
nav button:hover,nav button.active { background:#2e5b49; color:white; }
blockquote { margin:auto 5px 18px; padding:15px; border:1px solid #355448; border-radius:8px; color:#e1e7da; font:14px/1.55 Georgia,serif; }
blockquote small { display:block; margin-top:8px; color:#9eaf9f; font:10px Arial,sans-serif; }
.profile { display:flex; align-items:center; gap:9px; padding:13px 5px 0; border-top:1px solid #355448; font-size:11px; }
.profile>b { width:31px; height:31px; border-radius:50%; background:#dfb6a2; color:#563a30; font: bold 10px Arial,sans-serif; }

/* Header and page title */
main { display:flex; min-height:100vh; flex-direction:column; margin-left:235px; }
header { display:flex; height:64px; align-items:center; gap:15px; padding:0 34px; border-bottom:1px solid var(--line); background:#fffefaad; color:#899087; font-size:11px; }
header i { margin:0 8px; color:#c2c5bb; }
header b { color:#24362c; }
header input { width:190px; margin-left:auto; padding:9px 11px; border:1px solid var(--line); border-radius:6px; background:var(--white); font-size:11px; }
#menu { display:none; border:0; background:none; color:var(--green); font-size:18px; }
#content { width:min(100%,1320px); flex:1; margin:auto; padding:32px 34px; }
.heading { display:flex; align-items:end; justify-content:space-between; gap:20px; margin-bottom:22px; }
.kicker { margin-bottom:7px; color:#9a8061; font-size:9px; font-weight:bold; letter-spacing:1.5px; }
.heading h1 { margin:0; font:34px/1.15 Georgia,serif; }
.heading p { margin:7px 0 0; color:var(--muted); font-size:12px; }
.primary,.secondary,.quiet { padding:10px 13px; border:0; border-radius:6px; font-size:11px; font-weight:bold; }
.primary { background:var(--green); color:white; }
.primary:hover { background:#2d604c; }
.secondary { border:1px solid var(--line); background:white; color:var(--green); }
.quiet { padding:7px 9px; background:var(--sage); color:var(--green); font-size:10px; }

/* Overview cards and reading progress */
.hero { display:grid; grid-template-columns:1.35fr 1fr; gap:14px; margin-bottom:14px; }
.feature,.meeting,.panel,.stat,.item,.member { border:1px solid var(--line); border-radius:9px; background:var(--white); box-shadow:0 7px 22px #202a250a; }
.feature { display:flex; align-items:center; gap:20px; padding:20px; }
.cover { display:grid; width:112px; height:155px; flex:none; place-items:center; padding:13px; border-radius:3px 7px 7px 3px; background:linear-gradient(145deg,#35644f,#173d32); box-shadow:5px 7px 12px #152b2050; color:#f4e7ca; font:20px/1.15 Georgia,serif; text-align:center; }
.cover small { font:8px Arial,sans-serif; letter-spacing:1px; text-transform:uppercase; }
.feature h2,.meeting h2 { margin:4px 0; font:21px Georgia,serif; }
.feature p,.meeting p { margin:4px 0 13px; color:var(--muted); font-size:11px; }
.progress-label { display:flex; justify-content:space-between; margin:10px 0 5px; color:var(--muted); font-size:10px; }
.progress-label b { color:var(--green); }
.bar { height:5px; overflow:hidden; border-radius:5px; background:#e7e9df; }
.bar span { display:block; height:100%; background:#688b6e; }
.meeting { padding:20px; background:var(--green); color:white; }
.meeting .kicker { color:#e2c37b; }
.meeting p { color:#c5d4c5; }
.date { display:inline-grid; width:49px; height:54px; place-items:center; margin-right:10px; border-radius:6px; background:#f1e5c9; color:var(--green); font:23px Georgia,serif; }
.date small { font:bold 8px Arial,sans-serif; }
.meeting .primary { margin-top:7px; background:#f1e5c9; color:var(--green); }
.stats { display:grid; grid-template-columns:repeat(3,1fr); gap:11px; margin-bottom:14px; }
.stat { display:flex; align-items:center; gap:11px; padding:12px; }
.stat em { display:grid; width:34px; height:34px; place-items:center; border-radius:8px; background:var(--sage); color:var(--green); font-size:17px; font-style:normal; }
.stat small { display:block; color:var(--muted); font-size:9px; }
.stat b { font:19px Georgia,serif; }
.columns { display:grid; grid-template-columns:1.2fr 1fr; gap:14px; }
.panel { padding:16px; }
.panel-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:9px; }
.panel h2 { margin:0; font:17px Georgia,serif; }
.panel-head button { border:0; background:none; color:var(--green); font-size:10px; }
.row { display:flex; align-items:center; gap:11px; padding:11px 0; border-top:1px solid #f0efe9; }
.datebox { display:grid; width:37px; height:39px; place-content:center; border-radius:6px; background:#f0f3eb; color:#59705b; font:17px Georgia,serif; text-align:center; }
.datebox small { font:bold 8px Arial,sans-serif; }
.row-copy { flex:1; }
.row-copy b { display:block; font-size:10px; }
.row-copy small { color:var(--muted); font-size:9px; }
.tag { padding:5px 7px; border-radius:4px; background:#f7f1e4; color:#8a714a; font-size:8px; white-space:nowrap; }
.tag.meet { background:#edf3eb; color:#55735a; }
.topic { padding:12px 0; border-top:1px solid #f0efe9; }
.topic b { font-size:10px; }
.topic small { display:block; margin-top:5px; color:var(--muted); font-size:9px; }
.topic p { margin:6px 0 0; color:#858c82; font:italic 11px Georgia,serif; }

/* Books, members and conversations */
.grid { display:grid; grid-template-columns:repeat(3,1fr); gap:13px; }
.item,.member { padding:15px; }
.item .cover { width:65px; height:88px; font-size:13px; }
.item h3 { margin:12px 0 3px; font:16px Georgia,serif; }
.item p,.member p { color:var(--muted); font-size:10px; }
.item-foot { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:13px; padding-top:10px; border-top:1px solid #f0efe9; }
.item-foot button { border:0; background:none; color:var(--green); font-size:9px; font-weight:bold; }
.member { display:flex; align-items:start; gap:11px; }
.avatar { display:grid; width:38px; height:38px; flex:none; place-items:center; border-radius:50%; background:#dfb6a2; color:#513d34; font-size:10px; font-weight:bold; }
.member h3 { margin:2px 0; font-size:11px; }
.member p { margin:8px 0; }
.member strong { color:var(--green); }
.feed { display:grid; gap:12px; }
.topic-card { padding:15px; border:1px solid var(--line); border-radius:9px; background:var(--white); }
.topic-card h3 { margin:11px 0 4px; font:18px Georgia,serif; }
.topic-card>p { color:var(--muted); font-size:10px; line-height:1.5; }
.comment { padding:8px 0; border-top:1px solid #f0efe9; color:#6f776f; font-size:10px; }
.comment-form { display:flex; gap:7px; margin-top:8px; }
.comment-form input { min-width:0; flex:1; padding:9px; border:1px solid var(--line); border-radius:6px; font-size:10px; }
.comment-form button { padding:0 12px; border:0; border-radius:6px; background:var(--green); color:white; font-size:10px; }

/* Add and comment forms */
footer { padding:12px 34px 16px; color:#a2a39b; font-size:10px; }
dialog { width:min(440px,calc(100% - 30px)); padding:22px; border:1px solid var(--line); border-radius:10px; background:var(--white); color:#24362c; box-shadow:0 20px 70px #12261d55; }
dialog::backdrop { background:#13281f88; }
.form-head { display:flex; justify-content:space-between; margin-bottom:17px; }
.form-head h2 { margin:0 0 4px; font:22px Georgia,serif; }
.form-head small { color:var(--muted); font-size:10px; }
.form-head button { width:28px; height:28px; border:0; border-radius:50%; background:#f0f0ea; font-size:18px; }
.field { display:grid; gap:6px; margin-bottom:12px; }
.field label { color:#5c695e; font-size:10px; font-weight:bold; }
.field input,.field select,.field textarea { width:100%; padding:10px; border:1px solid var(--line); border-radius:6px; background:white; font-size:11px; }
.field textarea { min-height:70px; resize:vertical; }
.form-actions { display:flex; justify-content:end; gap:8px; margin-top:16px; }
#toast { position:fixed; right:18px; bottom:18px; z-index:5; display:none; padding:12px 15px; border:1px solid #dae6d8; border-radius:7px; background:white; color:var(--green); box-shadow:0 6px 20px #14281d24; font-size:11px; }
#toast.show { display:block; }

/* Smaller screens */
@media(max-width:900px) {
  aside { width:62px; padding:22px 8px; }
  aside .brand strong,aside .club,aside .label,aside nav span,aside nav small,aside blockquote,aside .profile span { display:none; }
  aside .brand { justify-content:center; }
  aside nav { margin-top:34px; }
  aside nav button { width:46px; justify-content:center; padding:12px 0; }
  aside .profile { justify-content:center; margin-top:auto; border:0; }
  main { margin-left:62px; }
  .grid { grid-template-columns:repeat(2,1fr); }
}
@media(max-width:640px) {
  aside { width:0; padding:0; overflow:hidden; }
  aside.open { width:230px; padding:20px 13px; box-shadow:8px 0 25px #10251c33; }
  aside.open .brand strong,aside.open .club,aside.open .label,aside.open nav span,aside.open blockquote,aside.open .profile span { display:block; }
  aside.open .club,aside.open nav button { display:flex; }
  aside.open nav { margin-top:0; }
  aside.open nav button { width:100%; justify-content:start; padding:12px 10px; }
  aside.open nav small { display:block; }
  aside.open .profile { justify-content:start; border-top:1px solid #355448; }
  main { margin-left:0; }
  header { height:56px; gap:8px; padding:0 12px; }
  #menu { display:block; }
  header input { width:34px; margin-left:auto; padding:7px; border:0; background:transparent; }
  header input:focus { position:absolute; right:125px; left:50px; width:auto; border:1px solid var(--line); background:white; }
  header .primary { padding:9px; font-size:9px; }
  #content { padding:23px 13px; }
  .heading { align-items:start; flex-direction:column; margin-bottom:18px; }
  .heading h1 { font-size:29px; }
  .hero,.columns { grid-template-columns:1fr; }
  .feature { gap:13px; padding:14px; }
  .cover { width:88px; height:132px; font-size:16px; }
  .feature h2 { font-size:17px; }
  .stats { gap:6px; }
  .stat { align-items:start; flex-direction:column; gap:6px; padding:9px; }
  .stat em { width:28px; height:28px; }
  .stat small { font-size:8px; }
  .stat b { font-size:17px; }
  .grid { grid-template-columns:1fr 1fr; gap:8px; }
  .item { padding:11px; }
  .item .cover { width:55px; height:78px; }
  .item h3 { font-size:14px; }
  .item-foot { align-items:start; flex-direction:column; }
  footer { padding:12px 14px; }
}
@media(max-width:380px) {
  .grid { grid-template-columns:1fr; }
  .feature { gap:9px; }
  .cover { width:75px; height:120px; }
  .feature h2 { font-size:15px; }
}

  </style>
</head>
<body>
  <div class="app">
    <aside id="sidebar">
      <a class="brand" href="#" data-page="home"><span>▤</span><strong>The Reading Room</strong></a>
      <p class="club"><b>R</b><span><strong>Readers &amp; Co.</strong><small>Private book club</small></span></p>
      <small class="label">YOUR SPACE</small>
      <nav>
        <button class="active" data-page="home">⌂ <span>Overview</span></button>
        <button data-page="books">▤ <span>Bookshelf</span><small id="book-count"></small></button>
        <button data-page="members">♧ <span>Members</span></button>
        <button data-page="plan">▦ <span>Reading plan</span></button>
        <button data-page="talk">◌ <span>Discussions</span></button>
      </nav>
      <blockquote>“A reader lives a thousand lives before he dies.”<small>— George R. R. Martin</small></blockquote>
      <div class="profile"><b>MC</b><span><strong>Mira Chen</strong><small>Club host</small></span></div>
    </aside>
    <main>
      <header>
        <button id="menu" aria-label="Open menu">☰</button>
        <span>Readers &amp; Co. <i>/</i> <b id="crumb">Overview</b></span>
        <input id="search" type="search" placeholder="Search your club" aria-label="Search your club">
        <button class="primary" data-open="member">＋ Invite member</button>
      </header>
      <section id="content"></section>
      <footer>Made for the love of a good story.</footer>
    </main>
  </div>
  <dialog id="dialog">
    <form id="form">
      <div class="form-head"><span><h2 id="form-title"></h2><small>Add a little more to your club.</small></span><button type="button" id="close">×</button></div>
      <div id="fields"></div>
      <div class="form-actions"><button type="button" class="secondary" id="cancel">Cancel</button><button class="primary">Save to the club</button></div>
    </form>
  </dialog>
  <div id="toast" role="status"></div>
  <script>
    /* Small book-club demo. Data is saved in this browser. */
const KEY = "reading-room-v2";
const colors = ["#dfb6a2", "#c7d2ac", "#c4c4df", "#e5c98b", "#b8d2ca"];
const dateIn = n => {
  const d = new Date(); d.setDate(d.getDate() + n);
  return [d.getFullYear(), String(d.getMonth()+1).padStart(2,"0"), String(d.getDate()).padStart(2,"0")].join("-");
};
const sample = {
  books: [
    {id:"b1",title:"The Midnight Library",author:"Matt Haig",genre:"Fiction",status:"reading",progress:68,color:"#244f40"},
    {id:"b2",title:"Crying in H Mart",author:"Michelle Zauner",genre:"Memoir",status:"up next",progress:0,color:"#9d5c45"},
    {id:"b3",title:"Piranesi",author:"Susanna Clarke",genre:"Fantasy",status:"up next",progress:0,color:"#566f87"},
    {id:"b4",title:"Small Things Like These",author:"Claire Keegan",genre:"Fiction",status:"finished",progress:100,color:"#7e6551"}
  ],
  members: [
    {name:"Mira Chen",role:"Host",booksRead:11,bio:"Usually reading two books at once."},
    {name:"Amara Okafor",role:"Member",booksRead:8,bio:"Collects favorite sentences."},
    {name:"Theo Park",role:"Member",booksRead:6,bio:"Here for the plot twists and snacks."},
    {name:"Sofia Alvarez",role:"Member",booksRead:9,bio:"A historical fiction fan."}
  ],
  events: [
    {title:"Sunday book-club gathering",date:dateIn(2),time:"5:30 PM",place:"Mira’s living room",type:"meeting",bookId:"b1",rsvp:true},
    {title:"Read through chapter 28",date:dateIn(3),time:"All day",place:"Your cozy corner",type:"goal",bookId:"b1",rsvp:false},
    {title:"Tea & next-book nominations",date:dateIn(9),time:"5:30 PM",place:"Juniper Café",type:"meeting",bookId:"b2",rsvp:false}
  ],
  topics: [
    {title:"Would you have opened the next door?",bookId:"b1",author:"Amara Okafor",date:"Yesterday",prompt:"Nora sees many versions of the life she might have lived. Which felt most real?",comments:["Theo Park: The swimming pool scene stayed with me.","Sofia Alvarez: Maybe the right life is the one she chose to notice."]},
    {title:"A line you had to read twice",bookId:"b1",author:"Jules Martin",date:"Monday",prompt:"Share a sentence that made you pause, and why it found you.",comments:["Priya Nair: “It is easy to mourn the lives we aren’t living.” Oof."]}
  ]
};
function loadClub() {
  try {
    const old = JSON.parse(localStorage.getItem(KEY));
    if (old && old.books && old.members && old.events && old.topics) {
      old.members.forEach(m => m.booksRead ??= m.reads || 0);
      old.events.forEach(e => e.bookId ??= e.book || "");
      old.topics.forEach(t => { t.author ??= t.by || "Mira Chen"; t.bookId ??= t.book || ""; });
      return old;
    }
  } catch (error) { /* Start with examples if saved data is missing. */ }
  return JSON.parse(JSON.stringify(sample));
}
let club = loadClub(), page = "home", search = "";
const $ = s => document.querySelector(s), content = $("#content"), form = $("#form"), dialog = $("#dialog");
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(club)); } catch (error) { notice("Could not save in this browser."); } };
const esc = value => String(value || "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const findBook = id => club.books.find(book => book.id === id);
const bookName = id => (findBook(id) || {}).title || "Club reading";
const parts = date => { const d = new Date(date + "T12:00"); return {month:d.toLocaleString("en",{month:"short"}).toUpperCase(),day:d.getDate()}; };
const avatar = name => '<span class="avatar" style="background:'+colors[name.length%colors.length]+'">'+esc(name.split(" ").map(x=>x[0]).slice(0,2).join(""))+'</span>';
const cover = b => '<div class="cover" style="background:linear-gradient(145deg,'+esc(b.color||"#466b57")+',#173b30)"><small>'+esc(b.author.split(" ").pop())+'</small>'+esc(b.title.split(" ").slice(0,3).join(" "))+'</div>';
const heading = (k,t,p,a) => '<div class="heading"><div><div class="kicker">'+k+'</div><h1>'+t+'</h1><p>'+p+'</p></div>'+(a||"")+'</div>';
const addButton = (type,label) => '<button class="primary" data-open="'+type+'">＋ '+label+'</button>';
const upcoming = () => club.events.filter(e=>e.date>=dateIn(0)).sort((a,b)=>a.date.localeCompare(b.date));
function eventRow(e,withRSVP) {
  const d=parts(e.date), right=withRSVP
    ? '<button class="quiet" data-action="rsvp" data-title="'+esc(e.title)+'">'+(e.rsvp?'✓ I’m in':'I’ll be there')+'</button>'
    : '<span class="tag '+(e.type==="meeting"?"meet":"")+'">'+(e.type==="meeting"?"Club meet":"Reading goal")+'</span>';
  return '<div class="row"><span class="datebox"><small>'+d.month+'</small>'+d.day+'</span><span class="row-copy"><b>'+esc(e.title)+'</b><small>'+esc(e.time)+' · '+esc(e.place)+'</small></span>'+right+'</div>';
}
/* Page builders keep the navigation and content together. */
function overview() {
  const current=club.books.find(b=>b.status==="reading"), meeting=upcoming().find(e=>e.type==="meeting");
  const reading=current ? cover(current)+'<div><div class="kicker">CURRENTLY READING</div><h2>'+esc(current.title)+'</h2><p>by '+esc(current.author)+'</p><div class="progress-label"><span>Club progress</span><b>'+current.progress+'%</b></div><div class="bar"><span style="width:'+current.progress+'%"></span></div><button class="quiet" data-action="progress" data-id="'+current.id+'">+ 5% read</button></div>'
    : '<div class="cover">Your next read awaits</div><div><h2>Choose your next book</h2><button class="quiet" data-page="books">Browse bookshelf</button></div>';
  const gathering=meeting ? '<h2>'+esc(meeting.title)+'</h2><p><span class="date"><small>'+parts(meeting.date).month+'</small>'+parts(meeting.date).day+'</span>'+esc(meeting.time)+' · '+esc(meeting.place)+'</p><button class="primary" data-page="plan">View reading plan →</button>'
    : '<h2>Let’s find a time to meet</h2><p>Make a date for your next conversation.</p><button class="primary" data-open="event">Schedule a meeting</button>';
  const finished=club.books.filter(b=>b.status==="finished").length;
  const events=upcoming().slice(0,3).map(e=>eventRow(e,false)).join("");
  const topics=club.topics.slice(-2).reverse().map(t=>'<div class="topic"><b>'+esc(t.title)+'</b><small>'+esc(bookName(t.bookId))+' · '+t.comments.length+' comments</small><p>'+esc(t.prompt)+'</p></div>').join("");
  return heading("YOUR BOOK CLUB · "+new Date().toLocaleDateString("en",{weekday:"long",month:"long",day:"numeric"}),"Good to see you, Mira","A good book brings us together.",addButton("topic","Start a discussion"))+
    '<div class="hero"><section class="feature">'+reading+'</section><section class="meeting"><div class="kicker">NEXT GATHERING</div>'+gathering+'</section></div>'+
    '<div class="stats"><div class="stat"><em>▤</em><span><small>Books finished</small><b>'+finished+'</b></span></div><div class="stat"><em>♧</em><span><small>Club members</small><b>'+club.members.length+'</b></span></div><div class="stat"><em>◌</em><span><small>Conversations</small><b>'+club.topics.length+'</b></span></div></div>'+
    '<div class="columns"><section class="panel"><div class="panel-head"><h2>Coming up</h2><button data-page="plan">Full plan →</button></div>'+events+'</section><section class="panel"><div class="panel-head"><h2>On the conversation list</h2><button data-page="talk">See all →</button></div>'+topics+'</section></div>';
}
function bookshelf() {
  const list=club.books.filter(b=>(b.title+" "+b.author).toLowerCase().includes(search));
  return heading("THE CLUB LIBRARY","Our bookshelf","Every story we’ve shared, and a few we can’t wait to open.",addButton("book","Add a book"))+'<div class="grid">'+list.map(b=>'<article class="item">'+cover(b)+'<span class="tag">'+esc(b.status)+'</span><h3>'+esc(b.title)+'</h3><p>'+esc(b.author)+' · '+esc(b.genre)+'</p><div class="item-foot"><small>'+(b.status==="reading"?b.progress+"% read":b.status==="finished"?"Read together":"On the club list")+'</small><button data-action="book" data-id="'+b.id+'">'+(b.status==="reading"?"+ 5%":b.status==="finished"?"Read again":"Make current")+'</button></div></article>').join("")+'</div>';
}
function membersPage() {
  const list=club.members.filter(m=>m.name.toLowerCase().includes(search));
  return heading("THE PEOPLE BEHIND THE PAGES","Meet your readers","Good stories are even better around the table.",addButton("member","Invite a member"))+'<div class="grid">'+list.map(m=>'<article class="member">'+avatar(m.name)+'<div><h3>'+esc(m.name)+' <small>'+esc(m.role)+'</small></h3><p>“'+esc(m.bio)+'”</p><small><strong>'+m.booksRead+'</strong> books read together</small></div></article>').join("")+'</div>';
}
function readingPlan() {
  return heading("MAKE A LITTLE SPACE TO READ","Our reading plan","Milestones, gatherings and dates to look forward to.",addButton("event","Add to the plan"))+'<section class="panel">'+(upcoming().map(e=>eventRow(e,true)).join("")||"<p>No dates yet. Add a reading goal or gathering.</p>")+'</section>';
}
function discussions() {
  const list=club.topics.slice().reverse().filter(t=>(t.title+" "+t.prompt).toLowerCase().includes(search));
  return heading("THOUGHTS BETWEEN THE PAGES","The conversation room","Questions, favorite lines, and what the story leaves with us.",addButton("topic","Start a discussion"))+'<div class="feed">'+list.map(t=>'<article class="topic-card">'+avatar(t.author)+' <b>'+esc(t.author)+'</b> · '+esc(t.date)+'<h3>'+esc(t.title)+'</h3><small class="kicker">'+esc(bookName(t.bookId))+'</small><p>'+esc(t.prompt)+'</p>'+t.comments.map(c=>'<div class="comment">'+esc(c)+'</div>').join("")+'<form class="comment-form" data-topic="'+club.topics.indexOf(t)+'"><input name="comment" placeholder="Add a comment…" required maxlength="240"><button>Reply</button></form></article>').join("")+'</div>';
}
function render() {
  const pages={home:overview,books:bookshelf,members:membersPage,plan:readingPlan,talk:discussions};
  $("#content").innerHTML=pages[page](); $("#book-count").textContent=club.books.length;
  $("#crumb").textContent={home:"Overview",books:"Bookshelf",members:"Members",plan:"Reading plan",talk:"Discussions"}[page];
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===page));
}
/* Forms use one shared pop-up for adding different kinds of club content. */
function bookOptions() { return club.books.map(b=>'<option value="'+b.id+'">'+esc(b.title)+'</option>').join(""); }
function openForm(type) {
  const bookField='<div class="field"><label>Related book</label><select name="bookId">'+bookOptions()+'</select></div>';
  const forms={
    book:["Add a book",'<div class="field"><label>Book title</label><input name="title" required></div><div class="field"><label>Author</label><input name="author" required></div><div class="field"><label>Genre</label><input name="genre"></div><div class="field"><label>Shelf status</label><select name="status"><option>Up next</option><option>Currently reading</option><option>Finished</option></select></div>'],
    member:["Invite a reader",'<div class="field"><label>Name</label><input name="name" required></div><div class="field"><label>A little introduction</label><textarea name="bio"></textarea></div>'],
    event:["Add to the reading plan",'<div class="field"><label>What’s happening?</label><input name="title" required></div><div class="field"><label>Date</label><input name="date" type="date" min="'+dateIn(0)+'" required></div><div class="field"><label>Time</label><input name="time" placeholder="5:30 PM"></div><div class="field"><label>Where / details</label><input name="place"></div><div class="field"><label>Kind of date</label><select name="type"><option value="meeting">Club gathering</option><option value="goal">Reading goal</option></select></div>'+bookField],
    topic:["Start a discussion",'<div class="field"><label>Conversation title</label><input name="title" required></div>'+bookField+'<div class="field"><label>Opening thought</label><textarea name="prompt" required></textarea></div>']
  };
  $("#form-title").textContent=forms[type][0]; $("#fields").innerHTML=forms[type][1];
  form.dataset.type=type; dialog.showModal();
}
function addItem(type,v) {
  if(type==="book"){
    const status={"Up next":"up next","Currently reading":"reading","Finished":"finished"}[v.status];
    if(status==="reading") club.books.forEach(b=>{if(b.status==="reading")b.status="up next";});
    club.books.unshift({id:"b"+Date.now(),title:v.title,author:v.author,genre:v.genre||"Fiction",status,progress:status==="finished"?100:0,color:"#466b57"}); page="books";
  } else if(type==="member"){
    club.members.push({name:v.name,role:"Member",booksRead:0,bio:v.bio||"Ready for a new story."}); page="members";
  } else if(type==="event"){
    club.events.push({title:v.title,date:v.date,time:v.time||"All day",place:v.place||"Details to come",type:v.type,bookId:v.bookId,rsvp:false}); page="plan";
  } else {
    club.topics.push({title:v.title,bookId:v.bookId,author:"Mira Chen",date:"Just now",prompt:v.prompt,comments:[]}); page="talk";
  }
  save(); render(); dialog.close(); notice("Saved to your club.");
}
function changeBook(id) {
  const book=findBook(id); if(!book)return;
  if(book.status==="finished"){book.status="reading";book.progress=0;}
  else if(book.status==="up next"){club.books.forEach(b=>{if(b.status==="reading")b.status="up next";});book.status="reading";}
  else {book.progress=Math.min(100,book.progress+5);if(book.progress===100)book.status="finished";}
  save();render();
}
function notice(message) {
  const toast=$("#toast");toast.textContent=message;toast.classList.add("show");
  setTimeout(()=>toast.classList.remove("show"),2200);
}
document.addEventListener("click",event=>{
  const button=event.target.closest("[data-page],[data-open],[data-action]");if(!button)return;
  if(button.dataset.page){event.preventDefault();page=button.dataset.page;$("#sidebar").classList.remove("open");render();}
  else if(button.dataset.open)openForm(button.dataset.open);
  else if(button.dataset.action==="book"||button.dataset.action==="progress")changeBook(button.dataset.id);
  else if(button.dataset.action==="rsvp"){
    const item=club.events.find(e=>e.title===button.dataset.title);item.rsvp=!item.rsvp;
    save();render();notice(item.rsvp?"You’re on the list!":"RSVP updated.");
  }
});
form.addEventListener("submit",event=>{event.preventDefault();addItem(form.dataset.type,Object.fromEntries(new FormData(form)));});
$("#close").onclick=$("#cancel").onclick=()=>dialog.close();
$("#menu").onclick=()=>$("#sidebar").classList.toggle("open");
$("#search").addEventListener("input",event=>{search=event.target.value.toLowerCase().trim();if(["books","members","talk"].includes(page))render();});
content.addEventListener("submit",event=>{
  const comment=event.target.closest("[data-topic]");if(!comment)return;
  event.preventDefault();club.topics[comment.dataset.topic].comments.push("Mira Chen: "+new FormData(comment).get("comment"));
  save();render();notice("Comment added.");
});
render();

  </script>
</body>
</html>
